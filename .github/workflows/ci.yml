# Runs on every pull request and on main: the same checks as locally.
# Free for public repositories.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI only checks code, it never writes to the repo.
permissions:
  contents: read

jobs:
  app:
    name: Types, lint, unit tests, build
    runs-on: ubuntu-latest
    env:
      # Dummy public values so the build can run; no real keys in CI.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # PageProps / LayoutProps are generated by Next.js (locally `next dev`
      # creates them); a clean machine needs them before the type check.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm test
      - run: npx next build
      # Everything under .next/static is sent to browsers. A server-only key
      # there would be public: fail the build if one ever appears.
      # Matches key VALUES, not names (supabase-js itself mentions the
      # "sb_secret_" prefix): a Supabase secret key, a Google client secret,
      # or a JWT whose payload says "service_role" (base64, three alignments).
      - name: No secrets in the browser bundle
        run: |
          if grep -rlE 'sb_secret_[A-Za-z0-9_-]{16,}|GOCSPX-|c2VydmljZV9yb2xl|NlcnZpY2Vfcm9sZ|zZXJ2aWNlX3JvbG' .next/static; then
            echo "A secret-looking string is in the browser bundle"; exit 1
          fi

  database:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          # Pinned (same as local): 'latest' needs a GitHub API call that can hit a rate limit.
          version: 3.3.0
      # Only the database is needed: migrations + seed, then the tests.
      - run: supabase db start
      - run: supabase test db
